  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);

    const blobUrls = {};

      const entry = manifest[uuid];

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er: 'Découvrir',\n      abOver: 'À propos', abH2: 'Amir, votre chauffeur privé à Colmar',\n      abP1: \"VTC Liberty, c'est Amir, chauffeur privé professionnel installé à Colmar, au cœur de l'Alsace. Chaque trajet est préparé avec soin : itinéraire étudié, véhicule impeccable, accueil personnalisé.\",\n      abP2: \"Discrétion, ponctualité et courtoisie sont les fondations du service. Que ce soit pour un rendez-vous d'affaires, un transfert d'aéroport ou une soirée, vous voyagez l'esprit libre.\",\n      ab1T: 'Ponctualité', ab1D: \"Prise en charge à l'heure, suivi des vols et des trains en temps réel.\",\n      ab2T: 'Discrétion', ab2D: 'Confidentialité totale, conduite souple et silencieuse.',\n      ab3T: 'Disponibilité', ab3D: '7 j/7 sur réservation, de jour comme de nuit.',\n      svOver: 'Nos services', svH2: 'Où vous voulez, quand vous voulez',\n      svIntro: \"Basé à Colmar, VTC Liberty vous conduit dans toute l'Alsace, en Allemagne, en Suisse — et partout où vous le souhaitez.\",\n      s1T: 'Transferts aéroports & gares', s1D: 'EuroAirport Bâle-Mulhouse, Strasbourg-Entzheim, Zurich, Francfort… et toutes les gares TGV de la région. Suivi de vol inclus.',\n      s2T: 'Longue distance', s2D: \"Paris, Lyon, Genève ou toute autre destination en France et en Europe. Tarif convenu à l'avance, sans surprise.\",\n      s3T: 'Événements & soirées', s3D: \"Mariages, restaurants gastronomiques, excursions sur la route des vins, marchés de Noël… Découvrez la région en toute liberté, on s'occupe de la route.\",\n      s4T: 'Déplacements professionnels', s4D: \"Rendez-vous d'affaires, mise à disposition à l'heure ou à la journée, facturation entreprise sur demande.\",\n      znOver: 'Zone de couverture', znH2: 'De Colmar vers toutes les destinations',\n      z1T: 'Colmar & environs', z1D: \"Colmar et les plus beaux villages de la route des vins : Riquewihr, Kaysersberg, Eguisheim, Ribeauvillé, Turckheim — jusqu'à Strasbourg, Mulhouse et les vallées vosgiennes.\",\n      z2T: 'Allemagne & Suisse', z2D: 'Freiburg, Bâle, Zurich, Francfort — passages de frontière en toute sérénité.',\n      z3T: 'Longue distance', z3D: 'Partout en France et en Europe, sur devis, de jour comme de nuit.',\n      mapDe: 'ALLEMAGNE', mapCh: 'SUISSE', mapFr: 'FRANCE', mapLong: 'longue distance',\n      whOver: 'Pourquoi nous choisir', whH2: \"L'exigence du détail, à chaque trajet\",\n      w1T: 'Confort', w1D: 'Berline récente, spacieuse et entretenue avec soin. Eau, chargeurs et silence à bord.',\n      w2T: 'Tarifs clairs', w2D: 'Prix annoncé avant le départ, sans majoration surprise. Devis gratuit pour toute demande.',\n      w3T: 'Disponibilité', w3D: '7 j/7 sur réservation, départs matinaux et retours de soirée compris.',\n      w4T: 'Expérience', w4D: 'Chauffeur professionnel agréé, parfaite connaissance de la région et des axes frontaliers.',\n      reOver: 'Réservation', reH2: 'Réservez votre trajet en ligne',\n      reP: 'Choisissez votre créneau en quelques secondes. Vous recevez une confirmation immédiate, et votre chauffeur vous attend à l\\'heure convenue.',\n      rePh1: 'Emplacement du widget Setmore',\n      rePh2: 'Collez ici votre lien de réservation Setmore (réglage « Lien Setmore » dans les Tweaks) : le calendrier s\\'affichera à cet endroit et tous les boutons « Réserver » du site pointeront dessus.',\n      reBtnTel: 'Réserver par téléphone', reBtnWa: 'Réserver sur WhatsApp',\n      fqOver: 'Questions fréquentes', fqH2: 'Tout savoir avant de réserver votre VTC à Colmar',\n      q1: 'Combien coûte un trajet en VTC à Colmar ?', a1: 'Le tarif est fixé et annoncé avant la réservation, sans majoration surprise — ni de nuit, ni le week-end. Devis gratuit et immédiat par téléphone ou WhatsApp.',\n      q2: \"Assurez-vous les transferts vers l'EuroAirport Bâle-Mulhouse ?\", a2: \"Oui, c'est l'un de nos trajets les plus demandés : environ 45 minutes depuis Colmar, avec suivi de votre vol en temps réel. Nous desservons aussi Strasbourg-Entzheim, Zurich et Francfort.\",\n      q3: 'Allez-vous en Allemagne et en Suisse ?', a3: 'Oui : Freiburg, Bâle, Zurich et au-delà. Les passages de frontière sont gérés en toute sérénité, à l\\'aller comme au retour.',\n      q4: 'Peut-on réserver à la dernière minute ?', a4a: 'Dans la mesure des disponibilités, oui. Pour un départ imminent, appelez directement le', a4b: ' — réponse immédiate.',\n      q5: 'Quels moyens de paiement acceptez-vous ?', a5: 'Carte bancaire, espèces et virement. Facturation possible pour les entreprises et les déplacements professionnels réguliers.',\n      ctOver: 'Contact', ctH2: 'Une question, un devis ?', ctTel: 'Téléphone', ctWaAct: 'Écrire un message',\n      ctNote: \"Réponse rapide, généralement sous une heure. Pour un départ imminent, privilégiez l'appel direct.\",\n      fName: 'Votre nom', fTel: 'Votre téléphone', fMsg: 'Votre trajet : départ, destination, date et heure…', fSend: 'Envoyer la demande',\n      slogan: \"La liberté d'aller où l'on souhaite\", mCall: 'Appeler',\n      mailSubject: 'Demande de devis — VTC Liberty',\n      seoOver: 'VTC à Colmar & en Alsace',\n      seoH2: 'Votre VTC à Colmar, du transfert quotidien au grand voyage',\n      seoP1: \"Vous cherchez un VTC à Colmar fiable et ponctuel ? VTC Liberty assure vos transferts privés au départ de Colmar (68000) et de tout le Haut-Rhin : aéroport EuroAirport Bâle-Mulhouse, aéroport de Strasbourg-Entzheim, aéroport de Zurich, ainsi que les gares TGV de Colmar, Mulhouse et Strasbourg. Suivi des vols et des trains en temps réel, prise en charge à domicile, à l'hôtel ou en entreprise.\",\n      seoP2: \"Chauffeur privé expérimenté basé à Colmar, Amir vous conduit aussi bien pour un court trajet en ville que pour une longue distance vers Paris, Lyon, Genève ou l'Allemagne et la Suisse (Freiburg, Bâle, Zurich, Francfort). Frontaliers, touristes et professionnels apprécient un service de chauffeur haut de gamme, discret et sans mauvaise surprise : le prix est fixé et annoncé avant le départ.\",\n      seoP3: \"Mariages, excursions sur la route des vins d'Alsace, marchés de Noël de Colmar, séminaires et déplacements d'affaires : réservez votre chauffeur VTC en ligne, par téléphone ou sur WhatsApp, 7 j/7. Un service de transport privé pensé pour Colmar, l'Alsace et au-delà.\",\n      galOver: \"Colmar & l'Alsace en images\", galH2: 'La région que nous parcourons chaque jour', galSub: \"Déposez vos propres photos libres de droit, ou laissez-nous vous faire découvrir les plus beaux décors d'Alsace.\",\n      cap1: 'La Petite Venise, Colmar', cap2: 'Vignoble & route des vins', cap3: 'Riquewihr & villages fleuris', cap4: 'Marché de Noël de Colmar'\n    },\n    en: {\n      navServices: 'Services', navZone: 'Coverage', navAbout: 'About', navContact: 'Contact', book: 'Book now',\n      heroOver: 'Private chauffeur — Colmar · Alsace',\n      heroT1: 'Your private chauffeur in Colmar,', heroT2: 'across Alsace and beyond.',\n      heroSub: 'Airport & train station transfers, long distance, events and business travel — in France, Germany and Switzerland.',\n      cta1: 'Book a ride', cta2: 'Our services', discover: 'Discover',\n      abOver: 'About', abH2: 'Amir, your private chauffeur in Colmar',\n      abP1: 'VTC Liberty is Amir, a professional private chauffeur based in Colmar, in the heart of Alsace. Every ride is carefully prepared: planned route, immaculate vehicle, personal welcome.',\n      abP2: 'Discretion, punctuality and courtesy are the foundations of the service. Business meeting, airport transfer or evening out — travel with complete peace of mind.',\n      ab1T: 'Punctuality', ab1D: 'On-time pickup, with real-time flight and train tracking.',\n      ab2T: 'Discretion', ab2D: 'Total confidentiality, smooth and quiet driving.',\n      ab3T: 'Availability', ab3D: '7 days a week by reservation, day and night.',\n      svOver: 'Our services', svH2: 'Wherever you want, whenever you want',\n      svIntro: 'Based in Colmar, VTC Liberty drives you throughout Alsace, to Germany, Switzerland — and anywhere you wish.',\n      s1T: 'Airport & station transfers', s1D: 'EuroAirport Basel-Mulhouse, Strasbourg-Entzheim, Zurich, Frankfurt… and every TGV station in the region. Flight tracking included.',\n      s2T: 'Long distance', s2D: 'Paris, Lyon, Geneva or any other destination in France and Europe. Fixed price agreed in advance, no surprises.',\n      s3T: 'Events & evenings', s3D: 'Weddings, fine dining, Wine Route excursions, Christmas markets… Enjoy the region freely, we handle the road.',\n      s4T: 'Business travel', s4D: 'Business meetings, hourly or daily hire, corporate invoicing on request.',\n      znOver: 'Coverage area', znH2: 'From Colmar to every destination',\n      z1T: 'Colmar & surroundings', z1D: 'Colmar and the finest villages on the Wine Route: Riquewihr, Kaysersberg, Eguisheim, Ribeauvillé, Turckheim — through to Strasbourg, Mulhouse and the Vosges valleys.',\n      z2T: 'Germany & Switzerland', z2D: 'Freiburg, Basel, Zurich, Frankfurt — border crossings handled seamlessly.',\n      z3T: 'Long distance', z3D: 'Anywhere in France and Europe, on quotation, day or night.',\n      mapDe: 'GERMANY', mapCh: 'SWITZERLAND', mapFr: 'FRANCE', mapLong: 'long distance',\n      whOver: 'Why choose us', whH2: 'Attention to detail, on every ride',\n      w1T: 'Comfort', w1D: 'Recent, spacious, meticulously maintained sedan. Water, chargers and quiet on board.',\n      w2T: 'Clear pricing', w2D: 'Price announced before departure, no hidden surcharges. Free quote for any request.',\n      w3T: 'Availability', w3D: '7 days a week by reservation, including early departures and late returns.',\n      w4T: 'Experience', w4D: 'Licensed professional chauffeur with expert knowledge of the region and cross-border routes.',\n      reOver: 'Booking', reH2: 'Book your ride online',\n      reP: 'Choose your slot in seconds. You receive instant confirmation, and your chauffeur is waiting at the agreed time.',\n      rePh1: 'Setmore widget placeholder',\n      rePh2: 'Paste your Setmore booking link here (the “Setmore link” setting): the calendar will appear in this spot and every “Book” button on the site will point to it.',\n      reBtnTel: 'Book by phone', reBtnWa: 'Book on WhatsApp',\n      fqOver: 'Frequently asked questions', fqH2: 'Everything to know before booking your ride in Colmar',\n      q1: 'How much does a private ride in Colmar cost?', a1: 'The fare is fixed and announced before booking, with no surprise surcharges — nights and weekends included. Free instant quote by phone or WhatsApp.',\n      q2: 'Do you provide transfers to EuroAirport Basel-Mulhouse?', a2: 'Yes — one of our most requested rides: about 45 minutes from Colmar, with real-time flight tracking. We also serve Strasbourg-Entzheim, Zurich and Frankfurt.',\n      q3: 'Do you drive to Germany and Switzerland?', a3: 'Yes: Freiburg, Basel, Zurich and beyond. Border crossings are handled smoothly, both ways.',\n      q4: 'Can I book at the last minute?', a4a: 'Subject to availability, yes. For an imminent departure, call directly:', a4b: ' — immediate answer.',\n      q5: 'Which payment methods do you accept?', a5: 'Card, cash and bank transfer. Invoicing available for companies and regular business travel.',\n      ctOver: 'Contact', ctH2: 'A question, a quote?', ctTel: 'Phone', ctWaAct: 'Send a message',\n      ctNote: 'Fast reply, usually within the hour. For an imminent departure, please call directly.',\n      fName: 'Your name', fTel: 'Your phone number', fMsg: 'Your trip: pickup, destination, date and time…', fSend: 'Send request',\n      slogan: 'The freedom to go wherever you wish', mCall: 'Call',\n      mailSubject: 'Quote request — VTC Liberty',\n      seoOver: 'Private driver in Colmar & Alsace',\n      seoH2: 'Your driver in Colmar, from the daily transfer to the long journey',\n      seoP1: \"Looking for a reliable, punctual private driver in Colmar? VTC Liberty handles your private transfers from Colmar (68000) and the whole Haut-Rhin: EuroAirport Basel-Mulhouse, Strasbourg-Entzheim airport, Zurich airport, and the TGV stations of Colmar, Mulhouse and Strasbourg. Real-time flight and train tracking, pickup at your home, hotel or office.\",\n      seoP2: \"An experienced private chauffeur based in Colmar, Amir drives you for a short city ride just as readily as for long distance to Paris, Lyon, Geneva or across the border to Germany and Switzerland (Freiburg, Basel, Zurich, Frankfurt). Cross-border commuters, visitors and professionals value a premium, discreet chauffeur service with no surprises — the price is fixed and announced before departure.\",\n      seoP3: \"Weddings, tours along the Alsace Wine Route, Colmar Christmas markets, seminars and business travel: book your private driver online, by phone or on WhatsApp, 7 days a week. A private transport service built for Colmar, Alsace and beyond.\",\n      galOver: 'Colmar & Alsace in pictures', galH2: 'The region we travel every day', galSub: 'Drop in your own royalty-free photos, or let us show you the finest sights of Alsace.',\n      cap1: 'La Petite Venise, Colmar', cap2: 'Vineyards & the Wine Route', cap3: 'Riquewihr & flowered villages', cap4: 'Colmar Christmas market'\n    },\n    de: {\n      navServices: 'Leistungen', navZone: 'Gebiet', navAbout: 'Über uns', navContact: 'Kontakt', book: 'Buchen',\n      heroOver: 'Privatchauffeur — Colmar · Elsass',\n      heroT1: 'Ihr Privatchauffeur in Colmar,', heroT2: 'im Elsass und darüber hinaus.',\n      heroSub: 'Flughafen- & Bahnhofstransfers, Langstrecken, Events und Geschäftsreisen — in Frankreich, Deutschland und der Schweiz.',\n      cta1: 'Fahrt buchen', cta2: 'Unsere Leistungen', discover: 'Entdecken',\n      abOver: 'Über uns', abH2: 'Amir, Ihr Privatchauffeur in Colmar',\n      abP1: 'VTC Liberty — das ist Amir, professioneller Privatchauffeur in Colmar, im Herzen des Elsass. Jede Fahrt wird sorgfältig vorbereitet: geplante Route, makelloses Fahrzeug, persönlicher Empfang.',\n      abP2: 'Diskretion, Pünktlichkeit und Höflichkeit sind die Grundlagen des Services. Ob Geschäftstermin, Flughafentransfer oder Abendveranstaltung — Sie reisen völlig entspannt.',\n      ab1T: 'Pünktlichkeit', ab1D: 'Abholung zur vereinbarten Zeit, mit Flug- und Zugverfolgung in Echtzeit.',\n      ab2T: 'Diskretion', ab2D: 'Absolute Vertraulichkeit, ruhige und souveräne Fahrweise.',\n      ab3T: 'Verfügbarkeit', ab3D: '7 Tage die Woche auf Reservierung, Tag und Nacht.',\n      svOver: 'Unsere Leistungen', svH2: 'Wohin Sie wollen, wann Sie wollen',\n      svIntro: 'Von Colmar aus fährt Sie VTC Liberty durch das ganze Elsass, nach Deutschland, in die Schweiz — und überallhin.',\n      s1T: 'Flughafen- & Bahnhofstransfers', s1D: 'EuroAirport Basel-Mulhouse, Straßburg-Entzheim, Zürich, Frankfurt… sowie alle TGV-Bahnhöfe der Region. Flugverfolgung inklusive.',\n      s2T: 'Langstrecken', s2D: 'Paris, Lyon, Genf oder jedes andere Ziel in Frankreich und Europa. Festpreis im Voraus, ohne Überraschungen.',\n      s3T: 'Events & Abende', s3D: 'Hochzeiten, Gourmetrestaurants, Ausflüge auf der Elsässer Weinstraße, Weihnachtsmärkte… Entdecken Sie die Region unbeschwert — wir kümmern uns um die Straße.',\n      s4T: 'Geschäftsfahrten', s4D: 'Geschäftstermine, stunden- oder tageweise Bereitstellung, Firmenrechnung auf Anfrage.',\n      znOver: 'Einsatzgebiet', znH2: 'Von Colmar zu allen Zielen',\n      z1T: 'Colmar & Umgebung', z1D: 'Colmar und die schönsten Dörfer der Weinstraße: Riquewihr, Kaysersberg, Eguisheim, Ribeauvillé, Turckheim — bis nach Straßburg, Mulhouse und in die Vogesentäler.',\n      z2T: 'Deutschland & Schweiz', z2D: 'Freiburg, Basel, Zürich, Frankfurt — Grenzübertritte völlig unkompliziert.',\n      z3T: 'Langstrecken', z3D: 'Überall in Frankreich und Europa, auf Anfrage, Tag und Nacht.',\n      mapDe: 'DEUTSCHLAND', mapCh: 'SCHWEIZ', mapFr: 'FRANKREICH', mapLong: 'Langstrecke',\n      whOver: 'Warum wir', whH2: & window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce) {\n      els.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      return;\n    }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.isIntersecting) {\n          en.target.style.opacity = '1';\n          en.target.style.transform = 'none';\n          io.unobserve(en.target);\n        }\n      });\n    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n    els.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(26px)';\n      el.style.transition = 'opacity .9s cubic-bezier(.22,.61,.36,1), transform .9s cubic-bezier(.22,.61,.36,1)';\n      el.style.transitionDelay = (el.getAttribute('data-reveal-delay') || '0') + 'ms';\n      io.observe(el);\n    });\n    this._io = io;\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._onMove) window.removeEventListener('mousemove', this._onMove);\n    if (this._mq && this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq);\n    if (this._io) this._io.disconnect();\n  }\n\n  _setLang(code) {\n    try { localStorage.setItem('vtc-liberty-lang', code); } catch (e) {}\n    document.documentElement.lang = code;\n    this.setState({ lang: code, langOpen: false });\n  }\n\n  renderVals() {\n    const lang = this.state.lang;\n    const t = Component.DICT[lang] || Component.DICT.fr;\n    const phone = this.props.phone ?? '06 95 33 69 20';\n    const email = this.props.email ?? 'contact@vtc-liberty.fr';\n    const waDigits = String(this.props.whatsapp ?? '33695336920').replace(/\\D/g, '');\n    const setmore = String(this.props.setmoreUrl ?? '').trim();\n    const phoneDigits = phone.replace(/\\D/g, '');\n    const phoneHref = 'tel:+33' + (phoneDigits.startsWith('0') ? phoneDigits.slice(1) : phoneDigits);\n    const cur = '#D8BC7F', off = '#C9C3B6';\n    retur
